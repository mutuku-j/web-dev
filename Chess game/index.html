<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Two-Player Chess</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <!-- Left Panel: Black's Captured Pieces -->
        <div class="panel">
            <h3>Captured by White</h3>
            <div id="captured-black" class="captured-box"></div>
        </div>

        <!-- Main Chessboard Container -->
        <div id="board" class="chessboard"></div>

        <!-- Right Panel: White's Captured Pieces & Turn Info -->
        <div class="panel">
            <h3>Captured by Black</h3>
            <div id="captured-white" class="captured-box"></div>
            <div class="turn-indicator">
                Current Turn: <span id="current-turn">White</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
